name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check npm package
        run: |
          package=$(npm pack --silent)
          tar -tzf "$package" | grep -Fx 'package/dist/server.js'
          tar -tzf "$package" | grep -Fx 'package/dist/analysis-worker.js'
          tar -tzf "$package" | grep -Fx 'package/dist/outline.js'
          tar -tzf "$package" | grep -Fx 'package/dist/base.bend'
          npm install --prefix /tmp/bend2-lsp-smoke "./$package"
          test -x /tmp/bend2-lsp-smoke/node_modules/.bin/bend2-lsp
          BEND2_LSP_SERVER=/tmp/bend2-lsp-smoke/node_modules/.bin/bend2-lsp node dist/test/server.test.js
